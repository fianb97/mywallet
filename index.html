<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="MyWallet — Aplikasi manajemen keuangan pribadi dengan multi-wallet, pencatatan transaksi, hutang-piutang, dan AI assistant.">
  <meta name="theme-color" content="#00450d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>MyWallet — Personal Finance Manager</title>

  <!-- DNS Prefetch & Preconnect for faster font loading -->
  <link rel="dns-prefetch" href="//fonts.googleapis.com">
  <link rel="dns-prefetch" href="//fonts.gstatic.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Fonts (with display=swap for instant text rendering) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <!-- Material Symbols Outlined (with display=swap) -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <!-- Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <!-- PWA & Favicon -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">
</head>
<body>
  <!-- App Splash Screen Overlay (Mobile & Desktop Initial Launch) -->
  <div id="app-splash-screen" class="splash-screen">
    <div class="splash-screen__content">
      <div class="splash-screen__icon-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
          <rect x="10" y="22" width="80" height="56" rx="10" ry="10" fill="#2e7d32" />
          <circle cx="78" cy="50" r="9.5" fill="#ffffff" />
          <circle cx="78" cy="50" r="4.8" fill="#2e7d32" />
        </svg>
      </div>
      <h1 class="splash-screen__title">MyWallet</h1>
      <span class="splash-screen__version">v1.0.0</span>
    </div>
  </div>

  <div id="app"></div>

  <!-- Scripts (order matters: utils, i18n, store, router, components, pages, app) -->
  <script src="js/utils.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/router.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/transactions.js"></script>
  <script src="js/pages/wallets.js"></script>
  <script src="js/pages/debts.js"></script>
  <script src="js/pages/bills.js"></script>
  <script src="js/pages/ai-assistant.js"></script>
  <script src="js/pages/custom-endpoints.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
